schema: agentforge.package/v1
id: mixed-tools
defaults:
  name: mixed-tools
  version: 2.0.0
  description: Mixed canonical skill and native extension
artifacts:
  - type: skill
    pattern: skills/*/SKILL.md
authoring-keys: [upstream]
targets:
  pi:
    overrides:
      name: mixed-tools-pi
      version: 2.1.0
    native:
      pi:
        extensions: ['./extensions/guard.js']
    payloads:
      include:
        - source: native/
          destination: extensions/
