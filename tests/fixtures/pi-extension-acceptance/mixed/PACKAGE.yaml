schema: agentforge.package/v1
id: af-acceptance-mixed
defaults:
  name: af-acceptance-mixed
  version: 1.0.0
  description: Mixed native extension and skill fixture
artifacts:
  - type: skill
    pattern: skills/*/SKILL.md
targets:
  pi:
    native:
      type: module
      peerDependencies:
        '@earendil-works/pi-coding-agent': '*'
        '@earendil-works/pi-ai': '*'
      pi:
        extensions: ['./extensions/guard.js']
        prompts: []
        themes: []
    payloads:
      include:
        - source: pi/extensions/
          destination: extensions/
        - source: pi/lib/
          destination: lib/
        - source: pi/assets/
          destination: assets/
