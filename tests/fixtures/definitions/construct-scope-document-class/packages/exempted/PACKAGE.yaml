schema: agentforge.package/v1
id: exempted
defaults:
  name: exempted
  version: 1.0.0
  description: Fixture package whose reference document names an mcp__ tool but is declared reference-or-diagnostic, so it carries no instruction-document report.
artifacts:
  - type: skill
    pattern: skills/*/SKILL.md
# Document class is orthogonal to artifact type. Declaring the reference file as
# an artifact instead would fuse "projectable artifact type" with "exempt from
# identifier scanning", and emit a spurious unsupported-artifact-projection for
# a file that was never meant to be translated.
documents:
  - class: reference
    pattern: skills/*/references/*.md
targets:
  codex:
    # Deliberately declares no `losses:` — the only mcp__ occurrence
    # lives in a document declared reference-or-diagnostic, which must not
    # require one.
    native:
      interface:
        displayName: Exempted
        category: Developer Tools
