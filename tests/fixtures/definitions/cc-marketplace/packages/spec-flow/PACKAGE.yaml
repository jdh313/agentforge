schema: agentforge.package/v1
id: spec-flow
defaults:
  name: spec-flow
  version: 0.12.2
  description: Contract-driven change workflow.
  author:
    name: Jacob Hoehler
  license: Apache-2.0
  keywords: [sdlc, contracts, specification]
artifacts:
  - type: skill
    pattern: skills/*/SKILL.md
  - type: command
    pattern: commands/*.md
  - type: hook
    pattern: hooks/hooks.json
payloads:
  include:
    - source: LICENSE.txt
    - source: skills/draft/scripts/check.ts
      collision: override
targets:
  claude:
    payloads:
      include:
        - source: hooks/hooks.json
          destination: native-hooks.json
  codex:
    payloads:
      include:
        - source: config/
          destination: config/
        - source: skills/draft/agents/openai.yaml
    native:
      interface:
        displayName: Spec Flow
        shortDescription: Drive contract-based code changes
        longDescription: Contract-driven capture, drafting, implementation, verification, and close workflows.
        developerName: Jacob Hoehler
        category: Developer Tools
        capabilities: [Read, Write, Interactive]
        defaultPrompt: [Draft a contract for this change.]
