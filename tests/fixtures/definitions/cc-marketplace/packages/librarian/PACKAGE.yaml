schema: agentforge.package/v1
id: librarian
defaults:
  name: librarian
  version: 0.17.1
  description: Curates, catalogs, retrieves, and maintains an Obsidian knowledge base.
  author:
    name: Jacob Hoehler
  license: Apache-2.0
  keywords: [obsidian, knowledge-base, notes, curation]
artifacts:
  - type: skill
    pattern: skills/*/SKILL.md
  - type: agent
    pattern: agents/*.md
targets:
  claude:
    native:
      description: Full Claude-native Librarian package metadata
  codex:
    overrides:
      description: Curates and retrieves notes through shared workflows and isolated roles.
    native:
      interface:
        displayName: Librarian
        shortDescription: Curate and retrieve Obsidian knowledge
        longDescription: Capture, process, retrieve, and maintain notes through approval-gated workflows and isolated vault roles.
        developerName: Jacob Hoehler
        category: Productivity
        capabilities: [Read, Write, Interactive]
        defaultPrompt:
          - Search my knowledge base for this topic.
          - Capture this as a structured note.
          - Inspect my vault without changing anything.
