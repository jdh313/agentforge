name: Release

on:
  push:
    branches: [main]
  # Manual retry lever: a startup_failure run cannot be rerun from the UI.
  workflow_dispatch:

# issues/pull-requests: write lets @semantic-release/github comment on the
# issues and PRs each release closes; contents: write covers the tag, the
# release, and the changelog/version commit pushed back to main.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # semantic-release cuts a release directly from every releasable push to main
  # (feat/fix/perf or a breaking change): it computes the version from the
  # commits since the last tag, commits CHANGELOG.md + package.json [skip ci],
  # tags vX.Y.Z, and publishes the GitHub release. chore/docs/ci pushes produce
  # no release and the jobs below are skipped.
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: semantic-release walks commits since the last tag.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.x

      - run: bun install --frozen-lockfile

      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The bin's shebang is node, which the runner provides; bunx would run
        # it under bun instead. Outputs are derived from the tag the run
        # creates, since semantic-release itself sets no step outputs.
        run: |
          before="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          node_modules/.bin/semantic-release
          after="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$after" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # Native-runner matrix, not cross-compiled from one host: bun build --compile
  # has open bugs cross-compiling to macOS (codesign truncation) and cross-libc
  # targets, so each OS/arch builds on its own runner instead (same shape as
  # ndr's release workflow, ndr:0128).
  build:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: agentforge-linux-x64
          - os: ubuntu-24.04-arm
            asset_name: agentforge-linux-arm64
          - os: macos-15-intel # last x64 macOS label (retired Fall 2027)
            asset_name: agentforge-darwin-x64
          - os: macos-latest
            asset_name: agentforge-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.x

      - run: bun install --frozen-lockfile

      - name: Build binary
        env:
          # macOS codesign truncation workaround (oven-sh/bun#29120): skip Bun's
          # own embedded signature, then ad-hoc sign explicitly below.
          BUN_NO_CODESIGN_MACHO_BINARY: 1
        run: bun run build

      - name: Ad-hoc codesign
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/agentforge

      - name: Smoke-test binary
        run: |
          mv dist/agentforge dist/${{ matrix.asset_name }}
          dist/${{ matrix.asset_name }} --version
          dist/${{ matrix.asset_name }} list-targets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  # One job attaches every binary plus a single SHA256SUMS, so consumers can pin
  # a version and verify with `sha256sum -c --ignore-missing SHA256SUMS`.
  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          chmod +x agentforge-*
          sha256sum agentforge-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            dist/agentforge-*
            dist/SHA256SUMS
